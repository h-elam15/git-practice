<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; max-width: 400px; }
        div { margin-bottom: 15px; }
        label { display: block; font-weight: bold; }
        input { width: 100%; padding: 8px; margin-top: 5px; }
        button { padding: 10px 15px; background-color: #007bff; color: white; border: none; cursor: pointer; }
        #result { margin-top: 20px; font-weight: bold; color: #333; }
    </style>
</head>
<body>

    <h2>Calculate Your BMI</h2>
    <form id="bmiForm">
        <div>
            <label>Feet:</label>
            <input type="number" id="feet" value="0" required>
        </div>
        <div>
            <label>Inches:</label>
            <input type="number" id="inches" value="0" min="0" max="11" required>
        </div>
        <div>
            <label>Weight (lbs):</label>
            <input type="number" id="weight" value="0" step="0.1" required>
        </div>
        <button type="submit">Calculate</button>
    </form>

    <div id="result"></div>

    <script>
        document.getElementById('bmiForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Prevents the page from reloading
            
            const feet = document.getElementById('feet').value;
            const inches = document.getElementById('inches').value;
            const weight = document.getElementById('weight').value;

            // Calls your Java cloud server endpoint
            fetch(`/calculate-bmi?feet=${feet}&inches=${inches}&weight=${weight}`)
                .then(response => response.text())
                .then(data => {
                    document.getElementById('result').innerText = data;
                });
        });
    </script>
</body>
</html>
